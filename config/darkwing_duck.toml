# Recompilation config for Darkwing Duck (Europe), MMC1.

[rom]
sha1 = "8c73e5f724ae8957570b0ea1b411e1ac5061bb24"

[recomp]
# Extra entry points, "BANK:ADDR" in hex.
entries = []
# Files with entry points recorded by running the game with --trace.
entries_files = ["darkwing_duck.entries"]
# Subroutines that never return to the instruction after the JSR
# (e.g. jump-table dispatchers that pop their return address).
noreturn = []

# ---- Cheats -----------------------------------------------------------------
# Each cheat is compiled into the game as a runtime switch and listed in the
# in-game menu (F1).
#   return = ["BANK:ADDR", ...]  the instruction at ADDR acts as RTS when enabled
#   skip   = ["BANK:ADDR", ...]  the instruction at ADDR is skipped when enabled

[[cheats]]
id = "invincible"
name = "Invincible"
description = "Enemies and projectiles can't hurt Darkwing. Falling into a pit still costs a life."
# $F9C2 is the player-damage routine: it starts the hurt animation and empties
# a quarter of the HUD heart (health lives in the heart tiles at $05B2-$05B8).
return = ["07:F9C2"]

[[cheats]]
id = "infinite_lives"
name = "Infinite lives"
description = "Losing a life doesn't decrease the lives counter."
# Lives are two digit tiles: $05E4 (tens) and $05E6 (ones, $70 = '0').
skip = ["07:CB15"]  # DEC $05E6

[[cheats]]
id = "infinite_gas"
name = "Infinite special gas"
description = "Special gas shots (Thunder, Heavy, Arrow) cost nothing. Pick up some gas first."
# $8982 (bank 6) adds a signed amount to the gas counter (digit tiles $05BE/$05C0);
# shots call it with -2/-3, pickups with +1/+10. $89A0 is the subtract path.
return = ["06:89A0"]

[[cheats]]
id = "stage_select"
name = "Stage select"
description = "Pick any location on the map and the chosen stage starts instead, including the final stage."
# $31 is the stage number: the map assigns 0-2 in the first round, 3-5 once
# $38 (stages cleared) reaches 3, and 6 (final) once it reaches 6. Bank 4 $8000
# is the stage loader (LDX $31); the map itself doesn't go through it.
choices = ["Bridge at night", "City streets", "Sewers", "Construction site", "Forest",
           "Waterfront", "The ship (final stage)"]
values = [0,1,2,3,4,5,6]
poke = [{ at = "04:8000", ram = ["0031"] }]

# ---- Markers ------------------------------------------------------------------
# Code locations that tell the frontend what the game is doing (used by Quick
# skip). Each sets a bit in nes_marks when it runs.

[[markers]]
id = "dialog_wait"   # waits for a button under a dialogue box (blinking arrow)
at = "02:A402"

[[markers]]
id = "map"           # map screen input loop
at = "02:A448"

[[markers]]
id = "gameplay"      # in-stage main loop
at = "07:C9AC"
